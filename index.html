<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  
  <!-- FAVICON DATA URI (Silences favicon 404 console warning) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏏</text></svg>">

  <!-- ANTI-CACHING META TAGS (Ensures Mobile & Desktop always load real-time code without old cache) -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <!-- PWA & Mobile Web App Installation -->
  <link rel="manifest" href="manifest.json" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CPL 2026" />
  <meta name="theme-color" content="#0F2C59" />

  <title>Cricket Premier League - Official Tournament & Registration Portal</title>
  
  <!-- Google Fonts: Hind Siliguri & Anek Bangla for Stylish Bengali Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@400;600;700;800;900&family=Caveat:wght@600;700&family=Hind+Siliguri:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Firebase App & Auth SDK for Live Phone OTP SMS Delivery -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

  <!-- Cropper.js CDN for Square Image Cropping -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>

  <!-- Custom Styles with Version Cache Buster -->
  <link rel="stylesheet" href="css/styles_v9.css?v=13.0.0" />
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen font-sans">

  <!-- CRICKET HERO INTRO SCREEN (CLEAN WHITE BACKGROUND - DEVELOPER: SUMAN KOLAY) -->
  <div id="intro-loading-screen" onclick="this.classList.add('fade-out'); this.style.pointerEvents='none'; setTimeout(() => this.remove(), 350);">
    <!-- Center Main Action Cricket Poster Image (No border, no shape) -->
    <div class="intro-stage-clean">
      <div class="intro-hero-poster-wrapper">
        <img src="assets/cricket_championship_hero.png" alt="Cricket Action" class="intro-hero-poster-img" id="intro-hero-img" onerror="this.src='assets/user_cartoon_cards_full.png'" />
      </div>
    </div>

    <!-- Lower Portion on White Background: Handwritten Developer - Suman Kolay (No shape/border) -->
    <div class="intro-developer-simple">
      <span id="typewriter-text" class="typewriter-handwritten"></span>
      <span class="typewriter-cursor-simple">|</span>
    </div>
  </div>

  <script>
    // Failsafe auto-dismiss after 2.6s so intro screen NEVER stays stuck
    setTimeout(function() {
      var intro = document.getElementById('intro-loading-screen');
      if (intro) {
        intro.classList.add('fade-out');
        intro.style.pointerEvents = 'none';
        setTimeout(function() { if (intro && intro.parentNode) intro.parentNode.removeChild(intro); }, 350);
      }
    }, 2600);
  </script>

  <!-- Upper Header (Blue & Indigo Gradient) -->
  <header id="app-navbar" class="sticky top-0 z-40 bg-gradient-to-r from-blue-700 via-blue-800 to-indigo-950 text-white rounded-b-2xl sm:rounded-b-3xl shadow-2xl border-b-2 border-blue-400/40 px-2 sm:px-4"></header>

  <!-- Main Content Container -->
  <main id="main-content" class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 py-2 sm:py-6"></main>

  <!-- Mobile Bottom Navigation Bar -->
  <nav id="mobile-bottom-nav"></nav>

  <!-- Application Main Script with Dynamic Cache Immunity -->
  <script type="module">
    import("./js/app_v9.js?t=" + Date.now());
  </script>
</body>
</html>
