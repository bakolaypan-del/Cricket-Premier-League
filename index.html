<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  
  <!-- FAVICON DATA URI (Silences favicon 404 console warning) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏏</text></svg>">

  <!-- ANTI-CACHING META TAGS (Ensures Mobile & Desktop always load real-time code without old cache) -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <!-- PWA & Mobile Web App Installation -->
  <link rel="manifest" href="manifest.json" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CPL 2026" />
  <meta name="theme-color" content="#0F2C59" />

  <title>Cricket Premier League - Official Tournament & Registration Portal</title>
  
  <!-- Google Fonts: Hind Siliguri & Anek Bangla for Stylish Bengali Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@400;600;700;800;900&family=Caveat:wght@600;700&family=Hind+Siliguri:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Cropper.js CDN for Square Image Cropping -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>

  <!-- Custom Styles with Automatic Dynamic Cache Buster -->
  <script>
    document.write('<link rel="stylesheet" href="css/styles_v9.css?t=' + Date.now() + '" />');
  </script>
  <noscript>
    <link rel="stylesheet" href="css/styles_v9.css?v=13.0.53" />
  </noscript>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen font-sans">

  <!-- CPL WELCOME INTRO SCREEN (only first visit per session) -->
  <div id="intro-loading-screen">
    <!-- Blurred cricket action images on sides -->
    <div class="intro-bg-left" style="background-image:url('assets/cricket_championship_hero.png')"></div>
    <div class="intro-bg-right" style="background-image:url('assets/cricket_championship_hero.png')"></div>
    <div class="intro-bg-overlay"></div>

    <!-- Center content -->
    <div class="intro-center">
      <div class="intro-welcome-label" id="intro-welcome-label">Welcome to</div>
      <div class="intro-cpl-row">
        <span class="intro-cpl-c" id="intro-c">C</span>
        <span class="intro-cpl-p" id="intro-p">P</span>
        <span class="intro-cpl-l-wrap">
          <span class="intro-cpl-l" id="intro-l">L</span>
          <span class="intro-ball" id="intro-ball">🔴</span>
        </span>
      </div>
      <div class="intro-full-name" id="intro-full-name">Cricket Premier League</div>
      <div class="intro-dev-shimmer" id="intro-dev-shimmer">Developer — Suman Kolay</div>
    </div>
  </div>

  <!-- REFRESH SPINNER (transparent overlay, page content visible behind) -->
  <div id="refresh-loading-spinner" style="display:none; position:fixed; inset:0; z-index:9999; background:rgba(255,255,255,0.35); backdrop-filter:blur(2px); justify-content:center; align-items:center;">
    <div style="width:44px; height:44px; border:4px solid rgba(0,0,0,0.1); border-top-color:#3b82f6; border-radius:50%; animation:cpl-spin .7s linear infinite;"></div>
  </div>
  <style>@keyframes cpl-spin{to{transform:rotate(360deg)}}</style>

  <script>
    (function() {
      var isFirstVisit = !sessionStorage.getItem('cpl_session_started');
      var intro = document.getElementById('intro-loading-screen');
      var spinner = document.getElementById('refresh-loading-spinner');
      if (isFirstVisit) {
        sessionStorage.setItem('cpl_session_started', '1');
        if (spinner) spinner.style.display = 'none';
        setTimeout(function() {
          if (intro) {
            intro.classList.add('fade-out');
            intro.style.pointerEvents = 'none';
            setTimeout(function() { if (intro && intro.parentNode) intro.parentNode.removeChild(intro); }, 500);
          }
        }, 6000);
      } else {
        if (intro) intro.remove();
        if (spinner) spinner.style.display = 'flex';
        setTimeout(function() {
          if (spinner) {
            spinner.style.opacity = '0';
            spinner.style.transition = 'opacity 0.3s';
            setTimeout(function() { if (spinner && spinner.parentNode) spinner.parentNode.removeChild(spinner); }, 300);
          }
        }, 800);
      }
    })();
  </script>

  <!-- Upper Header (Blue & Indigo Gradient) -->
  <header id="app-navbar" class="sticky top-0 z-40 bg-gradient-to-r from-blue-700 via-blue-800 to-indigo-950 text-white rounded-b-2xl sm:rounded-b-3xl shadow-2xl border-b-2 border-blue-400/40 px-2 sm:px-4"></header>

  <!-- Main Content Container -->
  <main id="main-content" class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 py-2 sm:py-6"></main>

  <!-- Mobile Bottom Navigation Bar -->
  <nav id="mobile-bottom-nav"></nav>

  <!-- Application Main Script with Dynamic Cache Immunity -->
  <script type="module">
    import("./js/app_v9.js?t=" + Date.now());
  </script>
</body>
</html>
