<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Host Tournament Banner - Compact Same-Row Layout</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@700;800;900&family=Hind+Siliguri:wght@700;800&family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .bengali-title { font-family: 'Anek Bangla', 'Hind Siliguri', sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-3 sm:p-6 flex flex-col items-center justify-center space-y-4">

  <div class="text-center space-y-1 max-w-md">
    <div class="inline-flex items-center gap-1.5 px-3 py-0.5 bg-emerald-400/20 text-emerald-300 rounded-full text-xs font-black border border-emerald-400/40">
      <span>✅</span> <span>COMPACT SAME-ROW DESIGN</span>
    </div>
  </div>

  <div class="max-w-md w-full">
    <!-- HOST YOUR OWN TOURNAMENT BANNER (COMPACT SAME-ROW DESIGN) -->
    <div class="bg-gradient-to-br from-[#120B24] via-[#1A1438] to-[#0A0618] rounded-2xl sm:rounded-3xl p-3 sm:p-4 text-white shadow-xl border border-purple-400/40 space-y-2.5 relative overflow-hidden">
      
      <!-- Top Tag & Bengali Header -->
      <div class="text-center space-y-0.5">
        <div class="inline-flex items-center gap-1 px-2.5 py-0.2 bg-emerald-400/20 border border-emerald-400/30 rounded-full text-[9.5px] sm:text-[10px] font-black text-emerald-300">
          <span>🚀</span> <span>Launch in 2 Minutes</span>
        </div>
        <h3 class="text-base sm:text-lg font-black text-white tracking-tight flex items-center justify-center gap-1.5 pt-0.5 bengali-title leading-tight">
          <span>🏆</span> <span>আপনার নিজের টুর্নামেন্ট তৈরি করুন</span>
        </h3>
        <p class="text-[10.5px] text-slate-300 font-medium">Create custom leagues with automated tools</p>
      </div>

      <!-- 2 Modes Side-by-Side in SAME ROW (grid-cols-2) -->
      <div class="grid grid-cols-2 gap-2 sm:gap-2.5">
        <!-- Mode A (Sunset Orange-Red Glow) -->
        <div class="p-2 sm:p-2.5 bg-gradient-to-b from-rose-500/30 via-orange-500/20 to-slate-900/80 rounded-xl sm:rounded-2xl border border-rose-400/80 shadow-md shadow-rose-500/10 space-y-1 text-center flex flex-col items-center justify-between">
          <div class="w-7 h-7 sm:w-7.5 sm:h-7.5 rounded-full bg-gradient-to-tr from-rose-500 to-orange-400 text-white flex items-center justify-center text-xs font-black shadow-xs shrink-0">
            🔨
          </div>
          <h4 class="text-[10px] sm:text-[11px] font-black text-orange-300 uppercase tracking-tight leading-tight">AUCTION MODE</h4>
          <p class="text-[8.5px] sm:text-[9px] text-orange-100/90 font-semibold leading-tight">
            Player Reg • Live Bidding • Squad • Fixture • Live Score
          </p>
        </div>

        <!-- Mode B (Emerald Green Glow) -->
        <div class="p-2 sm:p-2.5 bg-gradient-to-b from-emerald-500/30 via-teal-500/20 to-slate-900/80 rounded-xl sm:rounded-2xl border border-emerald-400/80 shadow-md shadow-emerald-500/10 space-y-1 text-center flex flex-col items-center justify-between">
          <div class="w-7 h-7 sm:w-7.5 sm:h-7.5 rounded-full bg-gradient-to-tr from-emerald-500 to-teal-400 text-white flex items-center justify-center text-xs font-black shadow-xs shrink-0">
            ⚡
          </div>
          <h4 class="text-[10px] sm:text-[11px] font-black text-emerald-300 uppercase tracking-tight leading-tight">FIXTURE MODE</h4>
          <p class="text-[8.5px] sm:text-[9px] text-emerald-100/90 font-semibold leading-tight">
            Direct Entry • Fixture • Live Score
          </p>
        </div>
      </div>

      <!-- Glowing Emerald CTA Button (Compact) -->
      <button class="w-full py-2.5 sm:py-3 bg-gradient-to-r from-emerald-400 via-teal-400 to-emerald-500 hover:from-emerald-500 hover:to-teal-500 text-slate-950 font-black text-xs sm:text-sm rounded-xl sm:rounded-2xl shadow-lg shadow-emerald-500/20 hover:scale-[1.01] active:scale-98 transition-all flex items-center justify-center gap-1.5 cursor-pointer">
        <span>+ Create Tournament</span>
        <span class="text-sm sm:text-base">➔</span>
      </button>
    </div>
  </div>

</body>
</html>
