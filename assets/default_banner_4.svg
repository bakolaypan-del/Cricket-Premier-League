<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <radialGradient id="ball4" cx="45%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="40%" stop-color="#d6f31f"/>
      <stop offset="100%" stop-color="#4d7c0f"/>
    </radialGradient>
    <linearGradient id="bat4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4a76a"/>
      <stop offset="50%" stop-color="#e8c88a"/>
      <stop offset="100%" stop-color="#b8864a"/>
    </linearGradient>
    <radialGradient id="fire4" cx="50%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="360" fill="url(#bg4)"/>
  <!-- Fire glow bottom -->
  <ellipse cx="400" cy="360" rx="400" ry="150" fill="url(#fire4)"/>
  <!-- Diagonal stripes -->
  <line x1="0" y1="0" x2="200" y2="360" stroke="#fff" stroke-width="40" opacity="0.03"/>
  <line x1="200" y1="0" x2="400" y2="360" stroke="#fff" stroke-width="40" opacity="0.03"/>
  <line x1="400" y1="0" x2="600" y2="360" stroke="#fff" stroke-width="40" opacity="0.03"/>
  <line x1="600" y1="0" x2="800" y2="360" stroke="#fff" stroke-width="40" opacity="0.03"/>
  <!-- Bat hitting ball - action pose -->
  <g transform="translate(350, 100) rotate(-40)">
    <rect x="-20" y="0" width="40" height="155" rx="10" fill="url(#bat4)" stroke="#8B4513" stroke-width="2"/>
    <rect x="-14" y="155" width="28" height="55" rx="5" fill="#6d4020"/>
    <rect x="-9" y="200" width="18" height="18" rx="4" fill="#1e40af"/>
    <line x1="-10" y1="25" x2="-10" y2="145" stroke="#b88a5a" stroke-width="0.8" opacity="0.5"/>
    <line x1="0" y1="20" x2="0" y2="148" stroke="#b88a5a" stroke-width="0.8" opacity="0.5"/>
    <line x1="10" y1="25" x2="10" y2="145" stroke="#b88a5a" stroke-width="0.8" opacity="0.5"/>
  </g>
  <!-- Tennis Ball with impact burst -->
  <g transform="translate(500, 140)">
    <!-- Impact rays -->
    <line x1="0" y1="0" x2="50" y2="-30" stroke="#fbbf24" stroke-width="3" opacity="0.5"/>
    <line x1="0" y1="0" x2="55" y2="5" stroke="#fbbf24" stroke-width="2" opacity="0.4"/>
    <line x1="0" y1="0" x2="40" y2="35" stroke="#fbbf24" stroke-width="2" opacity="0.3"/>
    <line x1="0" y1="0" x2="60" y2="-10" stroke="#f97316" stroke-width="2" opacity="0.3"/>
    <!-- Ball -->
    <circle cx="0" cy="0" r="30" fill="url(#ball4)"/>
    <path d="M -10 -28 C 8 -12, 8 12, -10 28" stroke="#fff" stroke-width="2.5" fill="none" opacity="0.7"/>
    <path d="M 10 -28 C -8 -12, -8 12, 10 28" stroke="#fff" stroke-width="2.5" fill="none" opacity="0.7"/>
    <circle cx="-6" cy="-6" r="5" fill="#fff" opacity="0.2"/>
  </g>
  <!-- Stumps flying -->
  <g transform="translate(620, 150) rotate(15)">
    <rect x="0" y="0" width="4" height="100" fill="#e5c07b" rx="2"/>
    <rect x="14" y="-10" width="4" height="100" fill="#e5c07b" rx="2" transform="rotate(8)"/>
    <rect x="28" y="-20" width="4" height="100" fill="#e5c07b" rx="2" transform="rotate(15)"/>
    <rect x="-2" y="-5" width="12" height="4" rx="2" fill="#fbbf24" transform="rotate(-10)"/>
    <rect x="16" y="-15" width="12" height="4" rx="2" fill="#fbbf24" transform="rotate(20)"/>
  </g>
  <!-- Gold accent line -->
  <line x1="50" y1="330" x2="750" y2="330" stroke="#fbbf24" stroke-width="2" opacity="0.4"/>
</svg>